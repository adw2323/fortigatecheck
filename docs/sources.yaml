fortios_versions:
  first_class:
    - "7.4"
    - "7.6"
  later:
    - "7.0"
    - "7.2"

allowed_domains:
  - "docs.fortinet.com"
  - "fortinetweb.s3.amazonaws.com"
  - "fortiguard.com"
  - "fortiguard.fortinet.com"
  - "cisa.gov"

sources:
  schema:
    - id: "fortinet_docs"
      kind: "html"
      domain: "docs.fortinet.com"
      versions:
        "7.4": "https://docs.fortinet.com/document/fortigate/7.4.11/cli-reference/84566/fortios-cli-reference"
        "7.6": "https://docs.fortinet.com/document/fortigate/7.6.6/cli-reference/84566/fortios-cli-reference"
      description: "Fortinet official documentation for FortiOS CLI/schema extraction."
  psirt:
    - id: "fortiguard_psirt"
      kind: "html"
      domain: "fortiguard.com"
      url: "https://fortiguard.fortinet.com/rss/ir.xml"
      description: "FortiGuard PSIRT advisories."
  kev:
    - id: "cisa_kev"
      kind: "json"
      domain: "cisa.gov"
      url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
      description: "CISA Known Exploited Vulnerabilities catalog."
