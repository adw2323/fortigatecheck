config system zone
    edit "INTERNET"
        set interface "wan1" "wan2"
    next
end
config system sdwan
    config members
        edit 1
            set interface "wan1"
        next
        edit 2
            set interface "wan2"
        next
    end
end
config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set device "virtual-wan-link"
    next
end
